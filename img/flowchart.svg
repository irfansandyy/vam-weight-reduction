<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2020" width="1200" height="2020" role="img" aria-labelledby="title description">
  <title id="title">Alur perhitungan VAM Reduksi Berbobot</title>
  <desc id="description">Diagram memperlihatkan validasi input, penyeimbangan dengan dummy, reduksi biaya satu kali, pengulangan alokasi pada garis aktif, serta verifikasi dan perhitungan total biaya asli.</desc>
  <style>
    text {font-family: Arial, Helvetica, sans-serif; fill:#183046;}
    .title {font-size:42px;font-weight:700;letter-spacing:-.6px;}
    .eyebrow {font-size:17px;letter-spacing:2.4px;font-weight:700;fill:#8c3740;}
    .subtitle {font-size:21px;fill:#40566a;}
    .box-title {font-size:25px;font-weight:700;}
    .smalltitle {font-size:23px;font-weight:700;}
    .body {font-size:21px;}
    .small {font-size:20px;}
    .question {font-size:22px;font-weight:700;}
    .branch {font-size:19px;font-weight:700;fill:#3e566b;}
    .terminal-text {font-size:24px;font-weight:700;fill:#fff;}
    .loop-text {font-size:22px;font-weight:700;fill:#81323b;}
    .fail-text {font-size:21px;font-weight:700;fill:#81323b;}
    .section {font-size:26px;font-weight:700;fill:#244866;}
    .foot {font-size:20px;fill:#40566a;}
    .box,.emphasis,.decision,.terminal,.loop,.fail,.note {stroke-width:2;}
    .box {fill:#fff;stroke:#879aab;}
    .emphasis {fill:#eef5fa;stroke:#63819c;}
    .decision {fill:#f6f9fc;stroke:#587189;}
    .terminal {fill:#244866;stroke:#244866;}
    .loop,.fail {fill:#fff0ef;stroke:#a96a70;}
    .error {fill:#fff5f3;stroke:#b67b80;stroke-width:2;}
    .note {fill:#f5f8fa;stroke:#ccd7e0;}
    .connector {fill:none;stroke:#6e8295;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
    .separator {fill:none;stroke:#d9e2ea;stroke-width:2;}
    .dot {fill:#6e8295;}
  </style>
  <rect width="1200" height="2020" fill="#fff"/>
  <path class="separator" d="M62 160 H1138"/>
  <path class="connector" d="M366 242 V277 M366 373 V411 M366 519 V566"/>
  <path class="connector" d="M614 465 H820"/>
  <path class="connector" d="M366 661 V701 M366 805 V904 M614 753 H798 M968 846 V874 H366"/>
  <path class="connector" d="M366 1039 V1074 M366 1185 V1222 M366 1330 V1373 M108 1276 H118 M614 1276 H810"/>
  <path class="connector" d="M974 1369 V1397 M974 1485 V1531 M810 1441 H755 M974 1637 V1680"/>
  <path class="connector" d="M366 1484 V1519 M366 1615 V1651 M366 1811 V1844"/>
  <path class="separator" d="M62 1914 H1138"/>
  <text class="eyebrow" x="62" y="48">DIAGRAM 1</text>
  <text class="title" x="62" y="99">Alur perhitungan VRB</text>
  <text class="subtitle" x="62" y="137">Ikuti urutan dari atas. Label Ya dan Tidak menunjukkan cabang keputusan.</text>
  <rect class="terminal" x="255.0" y="186" width="222" height="56" rx="28.0"/>
  <text class="terminal-text" x="366" y="222.0" text-anchor="middle">Mulai</text>
  <rect class="box" x="66" y="277" width="600" height="96" rx="11"/>
  <text class="box-title" x="89" y="313">1. Baca data</text>
  <text class="body" x="89" y="344">Baca ukuran, matriks biaya, pasokan, dan permintaan.</text>
  <polygon class="decision" points="366,411.0 614.0,465 366,519.0 118.0,465"/>
  <text class="question" x="366" y="458.5" text-anchor="middle">Data masukan</text>
  <text class="question" x="366" y="485.5" text-anchor="middle">valid?</text>
  <text class="branch" x="710" y="450" text-anchor="middle">Tidak</text>
  <text class="branch" x="389" y="549">Ya</text>
  <rect class="error" x="820" y="421" width="318" height="88" rx="11"/>
  <text class="smalltitle" x="843" y="457">Hentikan proses</text>
  <text class="small" x="843" y="488">Laporkan galat masukan.</text>
  <rect class="box" x="66" y="566" width="600" height="95" rx="11"/>
  <text class="box-title" x="89" y="602">2. Hitung total pasokan dan permintaan</text>
  <text class="body" x="89" y="633">Jumlahkan pasokan dan permintaan masing-masing.</text>
  <polygon class="decision" points="366,701.0 614.0,753 366,805.0 118.0,753"/>
  <text class="question" x="366" y="746.5" text-anchor="middle">Total pasokan sama</text>
  <text class="question" x="366" y="773.5" text-anchor="middle">dengan total permintaan?</text>
  <text class="branch" x="389" y="836">Ya</text>
  <text class="branch" x="708" y="738" text-anchor="middle">Tidak</text>
  <rect class="emphasis" x="798" y="684" width="340" height="162" rx="11"/>
  <text class="smalltitle" x="821" y="720">Tambahkan dummy</text>
  <text class="small" x="821" y="751">Pasokan lebih: kolom dummy.</text>
  <text class="small" x="821" y="777">Permintaan lebih: baris dummy.</text>
  <text class="small" x="821" y="803">Margin dummy = selisih total.</text>
  <text class="small" x="821" y="829">Biaya tiap sel dummy = 0.</text>
  <circle class="dot" cx="366" cy="874" r="4.5"/>
  <rect class="box" x="66" y="904" width="600" height="135" rx="11"/>
  <text class="box-title" x="89" y="940">3. Reduksi biaya satu kali</text>
  <text class="body" x="89" y="971">Kurangi tiap baris aktif dengan biaya minimumnya.</text>
  <text class="body" x="89" y="997">Dari hasil itu, kurangi minimum tiap kolom aktif.</text>
  <text class="body" x="89" y="1023">Simpan biaya asli untuk menghitung total.</text>
  <rect class="box" x="66" y="1074" width="600" height="111" rx="11"/>
  <text class="box-title" x="89" y="1110">4. Siapkan daftar aktif</text>
  <text class="body" x="89" y="1141">Urutkan sel aktif per garis menurut biaya reduksi,</text>
  <text class="body" x="89" y="1167">lalu indeks pasangan. Abaikan margin nol.</text>
  <polygon class="decision" points="366,1222.0 614.0,1276 366,1330.0 118.0,1276"/>
  <text class="question" x="366" y="1269.5" text-anchor="middle">Masih ada baris</text>
  <text class="question" x="366" y="1296.5" text-anchor="middle">dengan sisa pasokan positif?</text>
  <circle class="loop" cx="86" cy="1276" r="22"/>
  <text class="loop-text" x="86" y="1283" text-anchor="middle">A</text>
  <text class="branch" x="389" y="1360">Ya</text>
  <text class="branch" x="709" y="1261" text-anchor="middle">Tidak</text>
  <rect class="emphasis" x="810" y="1222" width="328" height="147" rx="11"/>
  <text class="smalltitle" x="833" y="1258">8. Verifikasi hasil</text>
  <text class="small" x="833" y="1289">Periksa alokasi nonnegatif</text>
  <text class="small" x="833" y="1315">dan kecocokan semua margin.</text>
  <text class="small" x="833" y="1341">Cocokkan total biaya asli.</text>
  <polygon class="decision" points="974,1397.0 1138.0,1441 974,1485.0 810.0,1441"/>
  <text class="question" x="974" y="1448.0" text-anchor="middle">Hasil valid?</text>
  <circle class="fail" cx="733" cy="1441" r="22"/>
  <text class="fail-text" x="733" y="1448" text-anchor="middle">G</text>
  <text class="branch" x="781" y="1427" text-anchor="middle">Tidak</text>
  <text class="branch" x="995" y="1515">Ya</text>
  <rect class="box" x="810" y="1531" width="328" height="106" rx="11"/>
  <text class="smalltitle" x="833" y="1567">9. Tampilkan hasil</text>
  <text class="small" x="833" y="1598">Tampilkan matriks alokasi</text>
  <text class="small" x="833" y="1624">dan biaya dari matriks asli.</text>
  <rect class="terminal" x="863.0" y="1680" width="222" height="56" rx="28.0"/>
  <text class="terminal-text" x="974" y="1716.0" text-anchor="middle">Selesai</text>
  <rect class="box" x="66" y="1373" width="600" height="111" rx="11"/>
  <text class="box-title" x="89" y="1409">5. Nilai setiap garis aktif</text>
  <text class="body" x="89" y="1440">Tentukan FLC, SLC, TLC, MAX, dan SKOR.</text>
  <text class="body" x="89" y="1466">Ajukan satu calon per garis. Lihat bagian A diagram 2.</text>
  <rect class="emphasis" x="66" y="1519" width="600" height="96" rx="11"/>
  <text class="box-title" x="89" y="1555">6. Bandingkan semua calon</text>
  <text class="body" x="89" y="1586">Ikuti prioritas di bagian B diagram 2.</text>
  <rect class="box" x="66" y="1651" width="600" height="160" rx="11"/>
  <text class="box-title" x="89" y="1687">7. Isi sel terpilih dan perbarui sisa</text>
  <text class="body" x="89" y="1718">Alokasikan q = min(sisa pasokan, sisa permintaan).</text>
  <text class="body" x="89" y="1744">Tambah q × biaya asli sel pada biaya berjalan.</text>
  <text class="body" x="89" y="1770">Kurangi kedua sisa sebesar q. Tutup garis yang habis.</text>
  <text class="body" x="89" y="1796">Hapus sel garis tertutup dari daftar aktif.</text>
  <circle class="loop" cx="366" cy="1866" r="22"/>
  <text class="loop-text" x="366" y="1873" text-anchor="middle">A</text>
  <text class="foot" x="62" y="1949">A: kembali ke pemeriksaan sisa pasokan tanpa mereduksi ulang biaya.</text>
  <text class="foot" x="62" y="1982">G: laporkan hasil tidak sah. Proses juga berhenti jika calon tidak dapat diisi atau hitungan meluap.</text>
</svg>
